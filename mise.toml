[tools]
go = "1.25"
# golangci-lint v2 (v1.64.x predates Go 1.25 and its bundled x/tools emits
# false-positive staticcheck findings on 1.25 sources).
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.12.2"

[tasks.build]
description = "Build the dfm binary"
run = "go build -o dfm ./cmd/dfm"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks."test:race"]
run = "go test -race ./..."

[tasks."test:cover"]
run = "go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
run = "gofmt -w ."

[tasks.setup-hooks]
description = "Configure git to use .githooks/"
run = "git config core.hooksPath .githooks"

[tasks.check]
description = "Run test, lint, and build (matches pre-push hook)"
depends = ["test", "lint", "build"]

[tasks.clean]
run = "rm -f dfm coverage.out coverage.html"
