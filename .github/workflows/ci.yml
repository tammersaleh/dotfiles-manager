name: CI checks

# Reusable only. pr.yml calls it for pull requests and the verify job in
# release.yml calls it for pushes to main. Keep every job at contents: read,
# the callers grant nothing more.
on:
  workflow_call:
    inputs:
      govulncheck:
        type: boolean
        required: false
        default: false

permissions: {}

env:
  # The stow parity suite (internal/stow/parity_test.go) is pinned to this
  # exact version. DFM_REQUIRE_STOW turns its skip into a failure so CI can
  # never silently run without it.
  STOW_VERSION: 2.4.1
  DFM_REQUIRE_STOW: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Build GNU Stow ${{ env.STOW_VERSION }} for the parity suite
        run: |
          set -euo pipefail
          curl -fsSL "https://ftp.gnu.org/gnu/stow/stow-${STOW_VERSION}.tar.gz" -o /tmp/stow.tar.gz
          tar -xzf /tmp/stow.tar.gz -C /tmp
          cd "/tmp/stow-${STOW_VERSION}"
          ./configure --quiet
          make --quiet
          sudo make --quiet install
          stow --version | grep -F "version ${STOW_VERSION}"

      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test

      - name: Lint
        run: mise run lint

      - name: Check known Go vulnerabilities
        if: inputs.govulncheck
        run: govulncheck ./...

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: check

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean --skip=publish
