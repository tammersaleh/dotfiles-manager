name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The stow parity suite (internal/stow/parity_test.go) is pinned to this
  # exact version. DFM_REQUIRE_STOW turns its skip into a failure so CI can
  # never silently run without it.
  STOW_VERSION: 2.4.1
  DFM_REQUIRE_STOW: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Build GNU Stow ${{ env.STOW_VERSION }} for the parity suite
        run: |
          set -euo pipefail
          curl -fsSL "https://ftp.gnu.org/gnu/stow/stow-${STOW_VERSION}.tar.gz" -o /tmp/stow.tar.gz
          tar -xzf /tmp/stow.tar.gz -C /tmp
          cd "/tmp/stow-${STOW_VERSION}"
          ./configure --quiet
          make --quiet
          sudo make --quiet install
          stow --version | grep -F "version ${STOW_VERSION}"

      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test

      - name: Lint
        run: mise run lint

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
